<!DOCTYPE html>

    <title>Document</title>
</head>
<body>
    <script>
        //rest operator
        function sum(...value){
            let total=0
            for(let n of value){
                total=total+n;
            }
            return total;
        }
        let result=sum(10,20,30);
        console.log(result);
    </script>
    
</body>
