     <h2>ARRAYS OPERATIONS PRACTICAL</h2>
    <script>
        let arr = [1, 2, 3, 4, 5];
        document.write("Original Array: " + arr + "<br>");

        arr.pop();
        document.write("After pop(): " + arr + "<br>");

        arr.push(6);
        document.write("After push(6): " + arr + "<br>");

        arr.shift();
        document.write("After shift(): " + arr + "<br>");

        arr.unshift(0);
        document.write("After unshift(0): " + arr + "<br>");

        arr.splice(2, 1, 7);
        document.write("After splice(2,1,7): " + arr + "<br>");
    </script>
    <!-- pop(): used to delete the last element of an array and return that element -->
    <!-- push(): used to add an element at the end of an array and return the new length of the array -->
    <!-- shift(): used to delete the first element of an array and return that element -->
    <!-- unshift(): used to add an element at the beginning of an array and return the new length of the array -->
    <!-- splice(index, no. of deletion, elements to add or remove or replace): used to add or remove elements from an array at a specific index and return the removed elements -->
   <!-- slice(): used to extract a portion of an array and return the new array -->
    <!-- concat(): used to merge two or more arrays and return a new array -->
