<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //spread operator//
        function sum(...values){
            let sum=0;
            for(let i in values){
                sum =sum+values[i];
            }
            console.log(sum);
        };
        let arr=[10,20,30];
        sum(...arr);
        
    </script>
    
</body>
