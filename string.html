<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>STRING OPERATIONS PRACTICAL </h2>
    <!-- toUpperCase() used to convert a string to uppercase -->
    <!-- toLowerCase() used to convert a string to lowercase -->
    <!-- charAt() used to extract a character from a string at a specific index -->
    <!-- indexOf() used to find the index of a character in a string -->
    <!-- lastIndexOf() used to find the index of the last occurrence of a character in a string -->
    <!-- slice() used to extract a portion of a string and return the new string -->
    <!-- split() used to split a string into an array of substrings -->
    <!-- includes() used to check if a string contains a specific substring -->
    <!-- replace() used to replace a substring with another substring -->
    <!-- concat() used to merge two or more strings and return a new string -->
     <script>
        let str= "DEEPANSHI PAL";
        document.write( str + "<br>");
        document.write( str.toUpperCase() + "<br>");
        document.write( str.toLowerCase() + "<br>");
        document.write( str.charAt(0) + "<br>");
        document.write(str.indexOf('P') + "<br>");
        document.write(str.lastIndexOf('A') + "<br>");
        document.write(str.slice(0, 7) + "<br>");
        document.write( str.split(' ') + "<br>");
        document.write(str.includes('DEEPANSHI') + "<br>");
        document.write(  str.replace('PAL', 'DIXIT') + "<br>");
        document.write( str.concat(' IS A STUDENT') + "<br>");
     </script>

    
</body>
</html>
